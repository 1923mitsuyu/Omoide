		215B6FD3307B86C100772D24 /* SwiftFormat */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = SwiftFormat;
			shellPath = /bin/sh;
			shellScript = (
				"# Mintのインストール先を探索する",
				"# 環境によってインストール先が異なるので、探索対象を２箇所明記する。",
				"export PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"",
				"",
				"# command -v mint: Mintコマンドが利用可能か調べる",
				"# >/dev/null: 出力を破棄する(eg.Mintコマンドを検索結果の出力)",
				"if command -v mint >/dev/null 2>&1; then",
				"    # Xcode のプロジェクトルートディレクトリに移動する",
				"    cd \"$SRCROOT\"",
				"    # Mint 経由で SwiftFormat を実行し、カレントディレクトリ(.)配下のSwiftファイルを整形する",
				"    mint run SwiftFormat .",
				"else",
				"    echo \"warning: Mint is not installed or not found in PATH.\"",
				"    echo \"PATH=$PATH\"",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

